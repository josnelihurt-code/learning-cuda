environment: "production"

server:
  http_port: "0.0.0.0:8080"
  https_port: "0.0.0.0:8443"
  webrtc_signaling_endpoint: "/cuda_learning.WebRTCSignalingService/StartSession"
  tls:
    enabled: false

go_feature_flag:
  enabled: true
  file_path: "/app/config/flags.goff.yaml"
  namespace: "default"

observability:
  enabled: true
  service_name: "cuda-image-processor"
  service_version: "1.0.0"
  # Grafana Cloud OTLP gateway (stack olivesofa1456, region us-west-0).
  # The token is injected at runtime via OTEL_EXPORTER_OTLP_TOKEN.
  otel_exporter_protocol: "http/protobuf"
  otel_collector_grpc_endpoint: "alpha.local.josnelihurt.me:4317"
  otel_collector_http_endpoint: "https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
  otel_auth_instance_id: "1836703"
  otel_environment: "production"
  trace_sampling_rate: 1.0

logging:
  level: "debug"
  format: "json"
  output: "file"
  file_path: "/tmp/goserver.log"
  include_caller: true
  remote_enabled: true
  remote_endpoint: "https://otlp-gateway-prod-us-west-0.grafana.net/otlp/v1/logs"
  remote_environment: "production"

processor:
  library_base_path: "/app/lib"
  listen_address: ":60062"
  keepalive_interval: 15s
  keepalive_timeout: 45s
  tls:
    cert_file: "/app/secrets/server.pem"
    key_file: "/app/secrets/server-key.pem"
    client_ca_file: "/app/secrets/ca.pem"

mqtt:
  broker: "mosquitto"
  port: 1883
  client_id: "cuda-learning-remote-management"
  topic: "pow/S31JetsonNanoOrin"

static_images:
  directory: "/app/data/static_images"

tools:
  observability:
    - id: "jaeger"
      name: "Jaeger Tracing"
      icon_path: "/static/img/tools/jaeger.svg"
      type: "url"
      url: "https://jaeger-cuda-demo.josnelihurt.me"
    - id: "grafana_logs"
      name: "Logs Dashboard"
      icon_path: "/static/img/tools/grafana.svg"
      type: "url"
      url: "https://grafana-cuda-demo.josnelihurt.me/d/cuda-multi-layer-logs"
    - id: "grafana_explore"
      name: "Grafana Explore"
      icon_path: "/static/img/tools/grafana.svg"
      type: "url"
      url: "https://grafana-cuda-demo.josnelihurt.me/explore"
  features:
    - id: "feature_flags"
      name: "Feature Flags"
      icon_path: ""
      type: "action"
      action: "open_feature_flags"
  testing:
    - id: "bdd_reports"
      name: "Test Reports (BDD)"
      icon_path: ""
      type: "url"
      url: "https://reports-cuda-demo.josnelihurt.me"
    - id: "e2e_reports"
      name: "E2E Test Results (Playwright)"
      icon_path: "/static/img/tools/playwright.svg"
      type: "url"
      url: "https://reports-cuda-demo.josnelihurt.me/e2e"
    - id: "coverage_reports"
      name: "Code Coverage"
      icon_path: ""
      type: "url"
      url: "https://reports-cuda-demo.josnelihurt.me/coverage"
