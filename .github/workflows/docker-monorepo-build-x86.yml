name: Docker Monorepo Build (x86)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: Force full rebuild regardless of changed paths
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  BASE_IMAGE_PREFIX: josnelihurt-code/learning-cuda

concurrency:
  group: docker-monorepo-x86-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# Smart CI: build/push steps only run when paths relevant to each image change.
# app (go-api) and web-frontend are independently gated so a frontend-only PR
# doesn't rebuild the Go binary (and vice versa).
# Force a full rebuild with either:
#   - PR label: ci:full-build
#   - workflow_dispatch (manual runs always force a full rebuild)
jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ["self-hosted"]
    outputs:
      app: ${{ steps.decide.outputs.app }}
      web_frontend: ${{ steps.decide.outputs.web_frontend }}
      yolo_model: ${{ steps.decide.outputs.yolo_model }}
      app_version_changed: ${{ steps.decide.outputs.app_version_changed }}
      web_frontend_version_changed: ${{ steps.decide.outputs.web_frontend_version_changed }}
      deployable: ${{ steps.decide.outputs.deployable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'proto/**'
              - 'src/go_api/**'
              - 'Dockerfile'
              - 'runtime/**'
              - 'data/**'
              - 'buf.yaml'
              - 'buf.lock'
              - 'buf.gen.yaml'
              - 'buf.gen.backend.yaml'
              - 'versions.env'
            app_version:
              - 'src/go_api/VERSION'
            web_frontend:
              - 'proto/**'
              - 'src/front-end/**'
              - 'buf.yaml'
              - 'buf.lock'
              - 'buf.gen.yaml'
              - 'scripts/docker/build-local.sh'
              - 'scripts/docker/push-tagged-images.sh'
            web_frontend_version:
              - 'src/front-end/VERSION'
            yolo_model:
              - 'src/cpp_accelerator/yolo-model-gen/Dockerfile'
              - 'src/cpp_accelerator/yolo-model-gen/VERSION'
              - 'scripts/models/export_yolo_to_onnx.py'

      - name: Decide build scope
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL: ${{ inputs.force_all }}
          LABEL_FORCE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-build') }}
          FILTER_APP: ${{ steps.filter.outputs.app }}
          FILTER_APP_VERSION: ${{ steps.filter.outputs.app_version }}
          FILTER_WEB_FRONTEND: ${{ steps.filter.outputs.web_frontend }}
          FILTER_WEB_FRONTEND_VERSION: ${{ steps.filter.outputs.web_frontend_version }}
          FILTER_YOLO_MODEL: ${{ steps.filter.outputs.yolo_model }}
        run: |
          set -euo pipefail
          out() { printf '%s\n' "$1" >> "$GITHUB_OUTPUT"; }

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] \
             || [ "${FORCE_ALL}" = "true" ] \
             || [ "${LABEL_FORCE}" = "true" ]; then
            out "app=true"
            out "web_frontend=true"
            out "yolo_model=true"
            out "app_version_changed=true"
            out "web_frontend_version_changed=true"
            out "deployable=true"
          else
            out "app=${FILTER_APP:-false}"
            out "web_frontend=${FILTER_WEB_FRONTEND:-false}"
            out "yolo_model=${FILTER_YOLO_MODEL:-false}"
            out "app_version_changed=${FILTER_APP_VERSION:-false}"
            out "web_frontend_version_changed=${FILTER_WEB_FRONTEND_VERSION:-false}"
            # Deployable if either app or web-frontend VERSION changed
            if [ "${FILTER_APP_VERSION:-false}" = "true" ] || [ "${FILTER_WEB_FRONTEND_VERSION:-false}" = "true" ]; then
              out "deployable=true"
            else
              out "deployable=false"
            fi
          fi

  go-test-race:
    name: Go tests (race)
    if: github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tests run inside Docker with the same Go environment as the build
      # pipeline (test/unit/Dockerfile) — the runner's own toolchain is never
      # used. The image regenerates the untracked proto/gen stubs internally
      # via the bufgen image.
      - name: Build bufgen image
        if: needs.detect-changes.outputs.app == 'true'
        run: docker build -t cuda-learning-bufgen:ci -f bufgen.dockerfile .

      - name: Build Go unit test image
        if: needs.detect-changes.outputs.app == 'true'
        run: docker build -t cuda-learning-go-test:ci -f test/unit/Dockerfile .

      - name: Run Go unit tests (race, in Docker)
        if: needs.detect-changes.outputs.app == 'true'
        run: docker run --rm cuda-learning-go-test:ci

      - name: No relevant changes
        if: needs.detect-changes.outputs.app != 'true'
        run: echo "No paths relevant to Go API changed; skipping go tests."

  build_app:
    name: Build app image (PRs only)
    if: github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build app image locally
        if: needs.detect-changes.outputs.app == 'true'
        env:
          REGISTRY: local
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
        run: |
          chmod +x scripts/docker/build-local.sh
          ./scripts/docker/build-local.sh \
            --stage proto-tools \
            --stage go-builder \
            --stage runtime-base \
            --stage proto \
            --stage golang \
            --stage app

      - name: No relevant changes
        if: needs.detect-changes.outputs.app != 'true'
        run: echo "No paths relevant to app image changed; skipping app build."

  build_web_frontend:
    name: Build web-frontend image (PRs only)
    if: github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build web-frontend image locally
        if: needs.detect-changes.outputs.web_frontend == 'true'
        env:
          REGISTRY: local
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
        run: |
          chmod +x scripts/docker/build-local.sh
          ./scripts/docker/build-local.sh \
            --stage proto-tools \
            --stage proto \
            --stage web-frontend

      - name: No relevant changes
        if: needs.detect-changes.outputs.web_frontend != 'true'
        run: echo "No paths relevant to web-frontend changed; skipping web-frontend build."

  push_app:
    name: Build and push app image
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: needs.detect-changes.outputs.app == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USER}" --password-stdin

      - name: Build app image
        if: needs.detect-changes.outputs.app == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
        run: |
          chmod +x scripts/docker/build-local.sh
          ./scripts/docker/build-local.sh \
            --stage proto-tools \
            --stage go-builder \
            --stage runtime-base \
            --stage proto \
            --stage golang \
            --stage app

      - name: Push app image
        if: needs.detect-changes.outputs.app == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
          LATEST_ALIASES: app
        run: |
          chmod +x scripts/docker/push-tagged-images.sh
          ./scripts/docker/push-tagged-images.sh

      - name: No relevant changes
        if: needs.detect-changes.outputs.app != 'true'
        run: echo "No paths relevant to app image changed; skipping app build and push."

  push_web_frontend:
    name: Build and push web-frontend image
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: needs.detect-changes.outputs.web_frontend == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USER}" --password-stdin

      - name: Build web-frontend image
        if: needs.detect-changes.outputs.web_frontend == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
        run: |
          chmod +x scripts/docker/build-local.sh
          ./scripts/docker/build-local.sh \
            --stage proto-tools \
            --stage proto \
            --stage web-frontend

      - name: Push web-frontend image
        if: needs.detect-changes.outputs.web_frontend == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
          LATEST_ALIASES: web-frontend
        run: |
          chmod +x scripts/docker/push-tagged-images.sh
          ./scripts/docker/push-tagged-images.sh

      - name: No relevant changes
        if: needs.detect-changes.outputs.web_frontend != 'true'
        run: echo "No paths relevant to web-frontend changed; skipping web-frontend build and push."

  build_yolo_model:
    name: Build yolo-model-gen image (PRs only)
    if: github.event_name == 'pull_request'
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build yolo-model-gen image locally
        if: needs.detect-changes.outputs.yolo_model == 'true'
        env:
          REGISTRY: local
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
        run: |
          chmod +x scripts/docker/build-local.sh
          ./scripts/docker/build-local.sh --stage yolo-tools --stage yolo-model

      - name: No relevant changes
        if: needs.detect-changes.outputs.yolo_model != 'true'
        run: echo "No paths relevant to yolo-model-gen changed; skipping build."

  push_yolo_model:
    name: Build and push yolo-model-gen image
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: detect-changes
    runs-on: ["self-hosted", "Linux", "X64"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: needs.detect-changes.outputs.yolo_model == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USER}" --password-stdin

      - name: Build and push yolo-model-gen image
        if: needs.detect-changes.outputs.yolo_model == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
        run: |
          chmod +x scripts/docker/build-local.sh
          ./scripts/docker/build-local.sh --stage yolo-tools --stage yolo-model

      - name: Push yolo-model-gen image
        if: needs.detect-changes.outputs.yolo_model == 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          BASE_IMAGE_PREFIX: ${{ env.BASE_IMAGE_PREFIX }}
          ARCH: amd64
          LATEST_ALIASES: yolo-model-gen
        run: |
          chmod +x scripts/docker/push-tagged-images.sh

      - name: No relevant changes
        if: needs.detect-changes.outputs.yolo_model != 'true'
        run: echo "No paths relevant to yolo-model-gen changed; skipping build and push."

  deploy_prod:
    name: Deploy production to Cloud VM
    needs:
      - detect-changes
      - push_app
      - push_web_frontend
      - push_yolo_model
    runs-on: ["self-hosted"]
    # Only redeploy when src/go_api/VERSION or src/front-end/VERSION actually bumped.
    # workflow_dispatch allows manual trigger; push to main requires VERSION change.
    if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.deployable == 'true' }}
    env:
      INFRA_DIRECTORY: /home/jrb/infra
      COMPOSE_DIRECTORY: /home/jrb/infra/services/compose
      COMPOSE_WORKDIR: /home/jrb/infra/services/vultur1
      CUDA_CONFIG_SUBDIR: cuda-learning
      CUDA_DATA_SUBDIR: learning-cuda
      CLOUD_VM_SSH_PORT: "22"
    steps:
      - name: Validate Cloud VM secrets and vars
        env:
          CLOUD_VM_HOST: ${{ secrets.CLOUD_VM_HOST }}
          CLOUD_VM_USER: ${{ secrets.CLOUD_VM_USER }}
          CLOUD_VM_SSH_KEY: ${{ secrets.CLOUD_VM_SSH_KEY }}
          ACCELERATOR_SERVER_CERT: ${{ secrets.ACCELERATOR_SERVER_CERT }}
          ACCELERATOR_SERVER_KEY: ${{ secrets.ACCELERATOR_SERVER_KEY }}
          ACCELERATOR_CA_CERT: ${{ secrets.ACCELERATOR_CA_CERT }}
          GRAFANA_CLOUD_OTLP_TOKEN: ${{ secrets.GRAFANA_CLOUD_OTLP_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUD_VM_HOST:?Missing CLOUD_VM_HOST secret}"
          : "${CLOUD_VM_USER:?Missing CLOUD_VM_USER secret}"
          : "${CLOUD_VM_SSH_KEY:?Missing CLOUD_VM_SSH_KEY secret}"
          : "${ACCELERATOR_SERVER_CERT:?Missing ACCELERATOR_SERVER_CERT secret}"
          : "${ACCELERATOR_SERVER_KEY:?Missing ACCELERATOR_SERVER_KEY secret}"
          : "${ACCELERATOR_CA_CERT:?Missing ACCELERATOR_CA_CERT secret}"
          : "${GRAFANA_CLOUD_OTLP_TOKEN:?Missing GRAFANA_CLOUD_OTLP_TOKEN secret}"
          echo "Cloud VM deploy target: ${CLOUD_VM_USER}@${CLOUD_VM_HOST}:${COMPOSE_WORKDIR} (port ${CLOUD_VM_SSH_PORT})"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          CLOUD_VM_SSH_KEY: ${{ secrets.CLOUD_VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${CLOUD_VM_SSH_KEY}" > ~/.ssh/cloud_vm_key
          chmod 600 ~/.ssh/cloud_vm_key

      - name: Add Cloud VM to known hosts
        env:
          CLOUD_VM_HOST: ${{ secrets.CLOUD_VM_HOST }}
        run: |
          set -euo pipefail
          ssh-keyscan -p "${CLOUD_VM_SSH_PORT}" -H "${CLOUD_VM_HOST}" >> ~/.ssh/known_hosts

      - name: Sync deployment files to Cloud VM
        env:
          CLOUD_VM_HOST: ${{ secrets.CLOUD_VM_HOST }}
          CLOUD_VM_USER: ${{ secrets.CLOUD_VM_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/cloud_vm_key -p ${CLOUD_VM_SSH_PORT} -o StrictHostKeyChecking=yes"
          REMOTE="${CLOUD_VM_USER}@${CLOUD_VM_HOST}"

          ssh ${SSH_OPTS} "${REMOTE}" \
            "mkdir -p \
               '${COMPOSE_DIRECTORY}/config/${CUDA_CONFIG_SUBDIR}' \
               '${COMPOSE_DIRECTORY}/data/${CUDA_DATA_SUBDIR}'"

          rsync -az -e "ssh ${SSH_OPTS}" \
            infra/services/compose/learning-cuda.yaml \
            "${REMOTE}:${COMPOSE_DIRECTORY}/learning-cuda.yaml"

          rsync -az -e "ssh ${SSH_OPTS}" \
            config/config.production.yaml \
            config/flags.goff.yaml \
            src/front-end/nginx.conf \
            "${REMOTE}:${COMPOSE_DIRECTORY}/config/${CUDA_CONFIG_SUBDIR}/"

          rsync -az --delete -e "ssh ${SSH_OPTS}" \
            data/ \
            "${REMOTE}:${COMPOSE_DIRECTORY}/data/${CUDA_DATA_SUBDIR}/"

      - name: Sync accelerator mTLS secrets to Cloud VM
        env:
          CLOUD_VM_HOST: ${{ secrets.CLOUD_VM_HOST }}
          CLOUD_VM_USER: ${{ secrets.CLOUD_VM_USER }}
          ACCELERATOR_SERVER_CERT: ${{ secrets.ACCELERATOR_SERVER_CERT }}
          ACCELERATOR_SERVER_KEY: ${{ secrets.ACCELERATOR_SERVER_KEY }}
          ACCELERATOR_CA_CERT: ${{ secrets.ACCELERATOR_CA_CERT }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/cloud_vm_key -p ${CLOUD_VM_SSH_PORT} -o StrictHostKeyChecking=yes"
          REMOTE="${CLOUD_VM_USER}@${CLOUD_VM_HOST}"
          REMOTE_SECRETS_DIR="${COMPOSE_DIRECTORY}/config/${CUDA_CONFIG_SUBDIR}/secrets"

          stage_dir="$(mktemp -d)"
          trap 'rm -rf "${stage_dir}"' EXIT
          umask 077

          printf '%s' "${ACCELERATOR_SERVER_CERT}" > "${stage_dir}/server.pem"
          printf '%s' "${ACCELERATOR_SERVER_KEY}"  > "${stage_dir}/server-key.pem"
          printf '%s' "${ACCELERATOR_CA_CERT}"     > "${stage_dir}/ca.pem"
          chmod 600 "${stage_dir}"/*.pem

          ssh ${SSH_OPTS} "${REMOTE}" \
            "mkdir -p '${REMOTE_SECRETS_DIR}' && chmod 700 '${REMOTE_SECRETS_DIR}'"

          rsync -az --chmod=F600 -e "ssh ${SSH_OPTS}" \
            "${stage_dir}/server.pem" \
            "${stage_dir}/server-key.pem" \
            "${stage_dir}/ca.pem" \
            "${REMOTE}:${REMOTE_SECRETS_DIR}/"

      - name: Compute versioned image tags
        id: tags
        run: |
          set -euo pipefail
          proto_version=$(tr -d '[:space:]' < proto/VERSION)
          go_version=$(tr -d '[:space:]' < src/go_api/VERSION)
          fe_version=$(tr -d '[:space:]' < src/front-end/VERSION)
          app_image="${REGISTRY}/${BASE_IMAGE_PREFIX}/app:${go_version}-amd64"
          fe_image="${REGISTRY}/${BASE_IMAGE_PREFIX}/web-frontend:fe-${fe_version}-proto${proto_version}-amd64"
          echo "app_image=${app_image}" >> "$GITHUB_OUTPUT"
          echo "fe_image=${fe_image}" >> "$GITHUB_OUTPUT"
          echo "Deploying APP_IMAGE=${app_image}"
          echo "Deploying CUDA_WEB_FRONTEND_IMAGE=${fe_image}"

      - name: Pull and restart services on Cloud VM
        env:
          CLOUD_VM_HOST: ${{ secrets.CLOUD_VM_HOST }}
          CLOUD_VM_USER: ${{ secrets.CLOUD_VM_USER }}
          APP_IMAGE: ${{ steps.tags.outputs.app_image }}
          CUDA_WEB_FRONTEND_IMAGE: ${{ steps.tags.outputs.fe_image }}
          OTEL_EXPORTER_OTLP_TOKEN: ${{ secrets.GRAFANA_CLOUD_OTLP_TOKEN }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/cloud_vm_key -p ${CLOUD_VM_SSH_PORT} -o StrictHostKeyChecking=yes"
          REMOTE="${CLOUD_VM_USER}@${CLOUD_VM_HOST}"
          ssh ${SSH_OPTS} "${REMOTE}" \
            "COMPOSE_WORKDIR='${COMPOSE_WORKDIR}' \
             APP_IMAGE='${APP_IMAGE}' \
             CUDA_WEB_FRONTEND_IMAGE='${CUDA_WEB_FRONTEND_IMAGE}' \
             OTEL_EXPORTER_OTLP_TOKEN='${OTEL_EXPORTER_OTLP_TOKEN}' \
             bash -s" <<'EOF'
          set -euo pipefail
          cd "${COMPOSE_WORKDIR}"
          export APP_IMAGE CUDA_WEB_FRONTEND_IMAGE OTEL_EXPORTER_OTLP_TOKEN

          # Stop and remove existing containers if they exist outside of compose
          docker ps -q --filter "name=cuda-go-server" | xargs -r docker stop
          docker ps -q --filter "name=cuda-web-frontend" | xargs -r docker stop
          docker ps -aq --filter "name=cuda-go-server" | xargs -r docker rm
          docker ps -aq --filter "name=cuda-web-frontend" | xargs -r docker rm

          docker compose up --pull always --force-recreate -d \
            learning-cuda-go-api learning-cuda-frontend

          timeout=60
          while [ "${timeout}" -gt 0 ]; do
            go_ok=$(docker ps --filter "name=^cuda-go-server$" --filter "status=running" --format "{{.Names}}")
            fe_ok=$(docker ps --filter "name=^cuda-web-frontend$" --filter "status=running" --format "{{.Names}}")
            if [ "${go_ok}" = "cuda-go-server" ] && [ "${fe_ok}" = "cuda-web-frontend" ]; then
              echo "Services are running"
              break
            fi
            sleep 1
            timeout=$((timeout - 1))
          done
          if [ "${timeout}" -eq 0 ]; then
            echo "Service readiness timeout reached" >&2
            docker ps --filter "name=cuda-"
            exit 1
          fi
          EOF

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/cloud_vm_key
