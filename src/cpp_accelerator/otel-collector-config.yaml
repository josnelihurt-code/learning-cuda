# OpenTelemetry Collector sidecar for the Jetson.
# Receives OTLP/gRPC on localhost from the C++ accelerator and exports to
# Grafana Cloud over HTTPS with Basic auth. TLS termination lives here
# because the accelerator's bazel-built curl/gRPC lack TLS support.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317

exporters:
  otlphttp/grafana:
    endpoint: https://otlp-gateway-prod-us-west-0.grafana.net/otlp
    headers:
      Authorization: "${env:GRAFANA_OTLP_AUTH_HEADER}"

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/grafana]
    traces:
      receivers: [otlp]
      exporters: [otlphttp/grafana]
