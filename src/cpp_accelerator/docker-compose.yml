services:
  accelerator-client:
    image: "${ACCELERATOR_IMAGE:?ACCELERATOR_IMAGE is not set, provide versioned tag cpp-accelerator-X.Y.Z-protoA.B.C-arm64}"
    container_name: cuda-accelerator-client
    restart: unless-stopped
    runtime: nvidia
    # Host networking: the client binds the ICE UDP range (10000-10199) and the
    # TCP fallback (60060) directly on the host, so host candidates carry the
    # LAN IP. Public candidates come from observed_ip (contract 5.0.0).
    network_mode: host

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LD_LIBRARY_PATH=/usr/local/cuda-12.6/targets/aarch64-linux/lib:/usr/local/lib:/usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu/nvidia:$LD_LIBRARY_PATH
      - OTEL_LOGS_ENABLED=false
      - OTEL_LOGS_ENDPOINT=https://otel-cuda-demo.josnelihurt.me/v1/logs
      - OTEL_ENVIRONMENT=production
      # nvarguscamerasrc wbmode override (1=auto,2=incandescent,3=fluorescent,
      # 4=warm-fluorescent,5=daylight,6=cloudy-daylight). Auto-WB on the stock
      # Arducam IMX477 ISP tuning produces a cyan cast in mixed indoor light;
      # locking to a fixed preset corrects it. Override per-deploy without
      # rebuilding the image.
      - NVARGUS_WBMODE=1
      - CONTROL_KEEPALIVE_INTERVAL_S=${CONTROL_KEEPALIVE_INTERVAL_S:-15}
      - CONTROL_KEEPALIVE_TIMEOUT_S=${CONTROL_KEEPALIVE_TIMEOUT_S:-45}
      - CONTROL_MAX_RECONNECT_DELAY_S=${CONTROL_MAX_RECONNECT_DELAY_S:-60}

    command:
      - accelerator_control_client
      - --control_addr=vultur.josnelihurt.me:60062
      - --device_id=${ACCELERATOR_DEVICE_ID:-jetson-prod-01}
      - --display_name=${ACCELERATOR_DISPLAY_NAME:-Jetson Orin}
      - --client_cert=/secrets/client.pem
      - --client_key=/secrets/client-key.pem
      - --ca_cert=/secrets/ca.pem
      - --max_reconnect_delay_s=${CONTROL_MAX_RECONNECT_DELAY_S:-60}
      - --keepalive_interval_s=${CONTROL_KEEPALIVE_INTERVAL_S:-15}
      - --keepalive_timeout_s=${CONTROL_KEEPALIVE_TIMEOUT_S:-45}
      - --captures_dir=/app/captures
      - "--bird_watch_enabled=${BIRD_WATCH_ENABLED:-true}"
      - "--bird_watch_confidence=${BIRD_WATCH_CONFIDENCE:-0.4}"
      - "--bird_watch_idle_interval_s=${BIRD_WATCH_IDLE_INTERVAL_S:-3}"
      - "--bird_watch_alert_frames=${BIRD_WATCH_ALERT_FRAMES:-5}"
      - "--bird_watch_max_per_minute=${BIRD_WATCH_MAX_PER_MINUTE:-5}"
      - "--bird_watch_min_interval_s=${BIRD_WATCH_MIN_INTERVAL_S:-5}"
      - "--bird_watch_camera_id=${BIRD_WATCH_CAMERA_ID:-0}"
      - "--cameras=0,1"

    # Camera device pass-through for Jetson Argus camera framework.
    # nvarguscamerasrc requires access to Tegra platform devices in addition to
    # the V4L2 video nodes.  The exact set depends on JetPack version; this
    # covers JetPack 6 / R36.
    devices:
      - /dev/video0:/dev/video0   # CAM0 — IMX477
      - /dev/video1:/dev/video1   # CAM1 — IMX477 Motorized
      - /dev/v4l-subdev0:/dev/v4l-subdev0
      - /dev/v4l-subdev1:/dev/v4l-subdev1
      - /dev/v4l-subdev2:/dev/v4l-subdev2
      - /dev/v4l-subdev3:/dev/v4l-subdev3
      - /dev/media0:/dev/media0
      - /dev/nvhost-ctrl-gpu:/dev/nvhost-ctrl-gpu
      - /dev/nvhost-ctrl-isp:/dev/nvhost-ctrl-isp
      - /dev/nvhost-ctrl-isp-thi:/dev/nvhost-ctrl-isp-thi
      - /dev/nvhost-ctrl-nvcsi:/dev/nvhost-ctrl-nvcsi
      - /dev/nvhost-ctrl-vi0:/dev/nvhost-ctrl-vi0
      - /dev/nvhost-ctrl-vi0-thi:/dev/nvhost-ctrl-vi0-thi
      - /dev/nvhost-ctrl-vi1:/dev/nvhost-ctrl-vi1
      - /dev/nvhost-ctrl-vi1-thi:/dev/nvhost-ctrl-vi1-thi
      - /dev/nvhost-nvsched_ctrl_fifo-gpu:/dev/nvhost-nvsched_ctrl_fifo-gpu
      - /dev/nvmap:/dev/nvmap
      - /dev/nvgpu:/dev/nvgpu

    volumes:
      - ${ACCELERATOR_SECRETS_DIR:-./secrets}:/secrets:ro
      - ${ACCELERATOR_LOGS_DIR:-./logs}:/tmp:rw
      - /tmp/argus_socket:/tmp/argus_socket
      - /usr/local/cuda-12.6/targets/aarch64-linux/lib/libcudla.so.1:/usr/local/cuda-12.6/targets/aarch64-linux/lib/libcudla.so.1:ro
      - /usr/local/cuda-12.6/targets/aarch64-linux/lib/libcudla.so:/usr/local/cuda-12.6/targets/aarch64-linux/lib/libcudla.so:ro
      - /usr/local/cuda-12.6/targets/aarch64-linux/lib/libcudla.so.1.0.0:/usr/local/cuda-12.6/targets/aarch64-linux/lib/libcudla.so.1.0.0:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer.so.10:/usr/lib/aarch64-linux-gnu/libnvinfer.so.10:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer.so.10.3.0:/usr/lib/aarch64-linux-gnu/libnvinfer.so.10.3.0:ro
      - /usr/lib/aarch64-linux-gnu/libnvinfer_builder_resource.so.10.3.0:/usr/lib/aarch64-linux-gnu/libnvinfer_builder_resource.so.10.3.0:ro
      - /usr/lib/aarch64-linux-gnu/libnvonnxparser.so.10:/usr/lib/aarch64-linux-gnu/libnvonnxparser.so.10:ro
      # JetPack 6/R36 ships libnvbuf_utils as libnvbufsurface under the nvidia/ subdir.
      # Mount it over the linker stub compiled into the image.
      # IMPORTANT: before first start, remove bogus dirs Docker previously created:
      #   sudo rmdir /usr/lib/aarch64-linux-gnu/libnvbuf_utils.so
      #   sudo rmdir /usr/lib/aarch64-linux-gnu/libnvbuf_utils.so.2
      - /usr/lib/aarch64-linux-gnu/nvidia/libnvbufsurface.so.1.0.0:/usr/lib/aarch64-linux-gnu/libnvbuf_utils.so:ro
      - /usr/lib/aarch64-linux-gnu/nvidia/libnvbufsurface.so.1.0.0:/usr/lib/aarch64-linux-gnu/libnvbuf_utils.so.2:ro
      # JetPack 6/R36 nvidia libs needed by libnvbufsurface (libnvrm_mem, libnvrm_surface,
      # libnvos, libnvbuf_fdmap, libnvrm_gpu, etc.) — not present in the base container.
      - /usr/lib/aarch64-linux-gnu/nvidia:/usr/lib/aarch64-linux-gnu/nvidia:ro
      - ${ACCELERATOR_MODELS_DIR:-./models}:/opt/cuda/grpc/data/models:rw
      - ${ACCELERATOR_CAPTURES_DIR:-./captures}:/app/captures:rw

  # Sends each new bird-capture BMP to Telegram (idle without token/chat env).
  # See telegram-notifier/README.md.
  telegram-notifier:
    build: ./telegram-notifier
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ${ACCELERATOR_CAPTURES_DIR:-./captures}:/captures:ro

volumes: {}
